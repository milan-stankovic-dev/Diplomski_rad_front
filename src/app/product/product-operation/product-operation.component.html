<div class="modal is-active" *ngIf="isModalOpen">
  <div class="modal-background"></div>
  <div class="modal-content has-background-white py-5 px-5">
    <div class="container">
      <h1 class="title">{{ title }}</h1>
      <form [formGroup]="insertForm">

        <div class="field">
          <label class="label">Product Name</label>
          <div class="control">
            <input class="input" type="text" formControlName="productName" required>
          </div>
        </div>

        <div class="field">
          <label class="label">Weight (g)</label>
          <div class="control">
            <input class="input" type="number" formControlName="weight" required>
          </div>
        </div>

        <div class="field">
          <label class="label">Fragile</label>
          <div class="control">
            <div class="select">
              <select formControlName="fragile" required>
                <option value="" disabled [selected]="buttonText==='Insert'">Select an option</option>
                <option value=true>True</option>
                <option value=false>False</option>
              </select>
            </div>
          </div>
        </div>

        <div class="field">
          <label class="label">Current Stock</label>
          <div class="control">
            <input class="input" type="number" formControlName="amount" required>
          </div>
        </div>

        <div class="field">
          <label class="label">Minimal Stock</label>
          <div class="control">
            <input class="input" type="number" formControlName="minimalStock" required>
          </div>
        </div>

        <div class="field">
          <label class="label">Order Amount</label>
          <div class="control">
            <input class="input" type="number" formControlName="orderAmount" required>
          </div>
        </div>
<!--  -->
        <div class="field">
          <div class="controls-container">
            <div class="control">
              <label class="label">Product Type</label>
              <div class="select">
                <select formControlName="type" required>
                  <option value="" disabled>Select a type</option>
                  <option *ngFor="let productType of productTypes" [value]="productType">
                    {{ productType }}
                  </option>
                </select>
              </div>
            </div>
            <div class="control">
              <label class="label">Supplier</label>
              <div class="select">
                <select formControlName="supplier" required>
                  <option value="" disabled>Select a supplier</option>
                  <option *ngFor="let supplier of suppliers" [value]="supplier.id">
                    {{ supplier.name }}
                  </option>
                </select>
              </div>
            </div>
          </div>
        </div>
        

        

        <div class="field">
          <label class="label">Price (in RSD)</label>
          <div class="control">
            <input class="input" type="number" formControlName="price" required>
          </div>
        </div>

        <div class="field is-grouped" style="text-align: center;">
          <div class="control">
            <button class="button is-warning" (click)="alterModal()">Cancel</button>
          </div>
          <div class="control">
            <button class="button is-success" (click)="submitProduct()" [disabled]="insertForm.invalid">
              {{ buttonText }}
            </button>
          </div>
        </div>

      </form>
    </div>
  </div>
</div>

<app-modal-message
  *ngIf="isModalMessageOpen"
  [displayMessage]="messageToDisplay"
  (modalClosed)="handleMessageDisplayClosedEvent($event)">
</app-modal-message>
