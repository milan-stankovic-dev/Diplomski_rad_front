<div id="component-div">
    <div class="flex-div-parent" *ngIf="productToDisplay !== undefined; else noData">
      <div id="child-1-container" class="child-container">
        <label>ID:</label>
        <br>
        <input type="text" disabled [value]="productToDisplay.id">
        <br>
        <label>Product name:</label>
        <br>
        <input type="text" disabled [value]="productToDisplay.productName">
        <br>
        <label>Product weight:</label>
        <br>
        <input type="text" disabled [value]="productToDisplay.weight">
        <br>
        <label>Fragile:</label>
        <br>
        <select name="fragile-display" disabled>
            <option disabled selected [value]="productToDisplay.fragile">{{productToDisplay.fragile}}</option>
        </select>
        <br>
        <label>Current stock:</label>
        <br>
        <input type="text" disabled [value]="productToDisplay.currentStock">
      </div>
      <div id="child-2-container" class="child-container">
        <label>Order amount:</label>
        <br>
        <input type="text" disabled [value]="productToDisplay.orderAmount">
        <br>
        <label>Minimal stock:</label>
        <br>
        <input type="text" disabled [value]="productToDisplay.minimalStock">
        <br>
        <label>Product Type: </label>
        <br>
        <select name="type-display" disabled>
            <option disabled selected [value]="productToDisplay.type">{{productToDisplay.type}}</option>
        </select>
        <br>
        <label>Price:</label>
        <br>
        <input type="text" disabled [value]="productToDisplay.price">
        <br>
        <label>Supplier: </label>
        <br>
        <input type="text" disabled [value]="productToDisplay?.supplier?.name">
        <br>
      </div>
    </div>
</div>
<ng-template #noData>
  <div class="no-data-template">
    Please select a product from the drop-down list to display
  </div>
</ng-template>
